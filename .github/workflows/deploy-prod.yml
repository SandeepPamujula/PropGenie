name: Production Deployment Pipeline

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Step 1: Run frontend checks
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      # Step 1 (cont): Run backend checks
      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint Backend
        working-directory: backend
        run: ruff check .

      - name: Test Backend
        working-directory: backend
        run: python -m pytest tests/

      # Log deployment audit metadata
      - name: Log Deployment Metadata
        run: |
          echo "=== Deployment Audit Metadata ==="
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "=================================="

      # Configure AWS credentials for deployment
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 2: Terraform Workspace Select and Apply (Prod)
      - name: Terraform Apply (Production)
        working-directory: infra
        run: |
          terraform init
          terraform workspace select prod || terraform workspace new prod
          terraform apply -auto-approve \
            -var-file=environments/prod.tfvars \
            -var="mongodb_uri=${{ secrets.MONGODB_URI }}" \
            -var="langfuse_secret_key=${{ secrets.LANGFUSE_SECRET_KEY }}" \
            -var="langfuse_public_key=${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            -var="langfuse_base_url=${{ secrets.LANGFUSE_BASE_URL }}"

      # Step 3: Package Lambda and deploy
      - name: Package Lambda Function
        working-directory: backend
        run: |
          mkdir -p dist
          pip install -r requirements.txt --platform manylinux2014_x86_64 --only-binary=:all: -t dist/
          cp -r agents db models observability portal_configs utils graph.py handler.py dist/
          cd dist
          zip -r ../lambda.zip .
          cd ..
          aws lambda update-function-code --function-name propgenie-agent-prod --zip-file fileb://lambda.zip

      # Step 4: Build & Sync Frontend
      - name: Deploy Frontend to S3 & CloudFront Invalidation
        run: |
          # Fetch S3 bucket and CloudFront Dist ID from Terraform output
          cd infra
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          CLOUDFRONT_DIST_ID=$(terraform output -raw distribution_id)
          
          # Build frontend static files
          cd ../frontend
          npm run build
          
          # Sync to S3 bucket
          aws s3 sync out/ s3://$S3_BUCKET/ --delete
          
          # Invalidate CloudFront cache
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"

      # Step 5: Smoke test health endpoint with retry mechanism
      - name: Smoke Test (Health Endpoint)
        run: |
          cd infra
          CF_DOMAIN=$(terraform output -raw cloudfront_domain)
          echo "Smoke test targeting: https://$CF_DOMAIN/api/health"
          
          # Wait 15 seconds for initial cache invalidation propagation
          sleep 15
          
          # Poll the health endpoint (up to 12 attempts, every 10 seconds)
          for i in {1..12}; do
            echo "Attempt $i to fetch health status..."
            if curl -f -s "https://$CF_DOMAIN/api/health"; then
              echo "Smoke test passed successfully!"
              exit 0
            else
              echo "Health check endpoint did not return 200. Retrying in 10 seconds..."
              sleep 10
            fi
          done
          
          echo "Smoke test failed: Health check endpoint did not return 200 after 2 minutes."
          exit 1
